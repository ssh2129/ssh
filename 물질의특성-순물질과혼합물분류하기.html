<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신나는 과학 탐구: 순물질과 혼합물 분류하기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4A90E2;
      --pure-bg: #E8F5E9;
      --pure-border: #4CAF50;
      --pure-dark: #2E7D32;
      --mix-bg: #FFF3E0;
      --mix-border: #FF9800;
      --mix-dark: #E65100;
      --card-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      --card-shadow-hover: 0 12px 24px rgba(0, 0, 0, 0.16);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%);
      min-height: 100vh;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Canvas 축하 폭죽 연출 */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    .badge-stage {
      display: inline-block;
      background: #5c6bc0;
      color: white;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      box-shadow: 0 4px 10px rgba(92, 107, 192, 0.3);
    }

    h1 {
      font-family: 'Jua', sans-serif;
      font-size: 38px;
      color: #1a237e;
      margin: 4px 0 8px;
    }

    .guide-text {
      font-size: 17px;
      color: #455a64;
      margin: 0;
    }

    .main-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 분류 박스 영역 */
    .drop-zones-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .drop-zone {
      background: white;
      border-radius: 20px;
      padding: 16px 20px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      border: 3px dashed #bbb;
      transition: all 0.25s ease;
      box-shadow: 0 6px 15px rgba(0,0,0,0.04);
    }

    .drop-zone.pure-zone {
      border-color: var(--pure-border);
      background-color: #f9fdfa;
    }
    .drop-zone.mix-zone {
      border-color: var(--mix-border);
      background-color: #fffdf9;
    }

    .drop-zone.dragover {
      transform: scale(1.015);
      border-style: solid;
      box-shadow: 0 10px 25px rgba(74, 144, 226, 0.25);
    }

    .zone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .zone-title {
      font-family: 'Jua', sans-serif;
      font-size: 26px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pure-zone .zone-title { color: var(--pure-dark); }
    .mix-zone .zone-title { color: var(--mix-dark); }

    .zone-count {
      font-size: 14px;
      font-weight: 700;
      color: #78909c;
      background: #eceff1;
      padding: 3px 12px;
      border-radius: 12px;
    }

    .zone-items-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      flex-grow: 1;
      align-content: flex-start;
      min-height: 180px;
    }

    .zone-placeholder {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 160px;
      color: #a0aec0;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      border: 2px dashed #e2e8f0;
    }

    /* 하단 카드 트레이 */
    .tray-container {
      background: white;
      border-radius: 20px;
      padding: 18px 24px;
      box-shadow: var(--card-shadow);
      border: 2px solid #e2e8f0;
    }

    .tray-header {
      font-size: 16px;
      font-weight: 700;
      color: #37474f;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tray-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
      min-height: 140px;
      align-items: center;
    }

    /* 카드 스타일 및 오답 시 피드백 스타일 */
    .item-card {
      background: white;
      border-radius: 16px;
      border: 2px solid #e0e7ff;
      padding: 10px 8px 8px;
      cursor: grab;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 135px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .item-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--card-shadow-hover);
      border-color: #6366f1;
    }

    .item-card.dragging {
      opacity: 0.5;
      cursor: grabbing;
      transform: scale(0.95);
    }

    /* 오답 상태 강조 표시 */
    .item-card.is-wrong {
      border: 3px solid #ef4444 !important;
      background-color: #fef2f2;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .item-img-wrap {
      width: 100%;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
      background: #fafafa;
    }

    .item-img-wrap svg {
      width: 86%;
      height: 86%;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .item-name {
      font-size: 15px;
      font-weight: 700;
      color: #2d3748;
      margin-top: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .return-hint {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ef5350;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .drop-zone .item-card .return-hint {
      display: flex;
    }

    /* 버튼 영역 */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 10px 0;
    }

    .btn {
      font-family: 'Jua', sans-serif;
      font-size: 22px;
      padding: 12px 34px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-check {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }
    .btn-check:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.45);
    }

    .btn-reset {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #cbd5e1;
    }
    .btn-reset:hover {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-next {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
    }
    .btn-next:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(16, 185, 129, 0.45);
    }

    /* 정답 정리 표 */
    #summary-section {
      display: none;
      background: white;
      border-radius: 20px;
      padding: 26px 30px;
      box-shadow: var(--card-shadow);
      border: 2px solid #cbd5e1;
      animation: fadeIn 0.4s ease;
      margin-top: 10px;
    }

    #summary-section h2 {
      font-family: 'Jua', sans-serif;
      font-size: 28px;
      color: #1e293b;
      margin: 0 0 16px 0;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
    }

    .summary-table th, .summary-table td {
      padding: 14px 18px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: 15px;
    }

    .summary-table th {
      background: #f1f5f9;
      color: #334155;
      font-weight: 800;
      text-align: center;
    }

    .badge-pure {
      background-color: #e8f5e9;
      color: #2e7d32;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      border: 1px solid #a5d6a7;
    }

    .badge-mix {
      background-color: #fff3e0;
      color: #e65100;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      border: 1px solid #ffcc80;
    }

    .component-tag {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      padding: 3px 8px;
      border-radius: 8px;
      margin: 2px 4px 2px 0;
      font-size: 13px;
      font-weight: 600;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      .drop-zones-wrapper { grid-template-columns: 1fr; }
      .tray-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <header>
    <div class="badge-stage" id="stageBadge">🌟 1단계 도전 중 (총 2단계)</div>
    <h1 id="stageTitle">순물질 vs 혼합물 분류하기</h1>
    <p class="guide-text">아래 카드를 드래그해서 <strong>[순물질 박스]</strong>와 <strong>[혼합물 박스]</strong>에 넣어보세요!</p>
  </header>

  <div class="main-container">
    <div class="drop-zones-wrapper">
      <!-- 순물질 존 -->
      <div class="drop-zone pure-zone" data-zone="pure" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'pure')">
        <div class="zone-header">
          <div class="zone-title">🧪 순물질 박스</div>
          <span class="zone-count" id="pureCount">0개</span>
        </div>
        <div class="zone-items-grid" id="pureItemsGrid">
          <div class="zone-placeholder">여기로 순물질 카드를 드래그하세요</div>
        </div>
      </div>

      <!-- 혼합물 존 -->
      <div class="drop-zone mix-zone" data-zone="mix" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'mix')">
        <div class="zone-header">
          <div class="zone-title">🥣 혼합물 박스</div>
          <span class="zone-count" id="mixCount">0개</span>
        </div>
        <div class="zone-items-grid" id="mixItemsGrid">
          <div class="zone-placeholder">여기로 혼합물 카드를 드래그하세요</div>
        </div>
      </div>
    </div>

    <!-- 대기 트레이 -->
    <div class="tray-container" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'tray')">
      <div class="tray-header">
        <span>선택할 물질 카드</span>
        <span style="font-size:13px; color:#888;">💡 카드의 ✕ 버튼을 누르면 원위치됩니다.</span>
      </div>
      <div class="tray-grid" id="trayGrid"></div>
    </div>

    <div class="action-bar">
      <button class="btn btn-check" onclick="checkAnswer()">🔍 결과 확인하기</button>
      <button class="btn btn-reset" onclick="resetCurrentStage()">🔄 다시 하기</button>
      <button class="btn btn-next" id="nextStageBtn" style="display: none;" onclick="goToNextStage()">🚀 2단계 도전하기!</button>
    </div>

    <!-- 학습 정리 표 -->
    <section id="summary-section">
      <h2 id="summaryHeading">📚 알짜배기 개념 정리 표</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th style="width: 14%;">분류</th>
            <th style="width: 22%;">물질명</th>
            <th style="width: 64%;">과학적 특징 및 구성 성분</th>
          </tr>
        </thead>
        <tbody id="summaryTableBody"></tbody>
      </table>
    </section>
  </div>

            desc: "나트륨(Na)과 염소(Cl)가 결합한 단일 결정 화합물(NaCl)인 순물질입니다.",
            components: ["염화나트륨(NaCl) 화합물"],
            svg: `<svg viewBox="0 0 100 80"><path d="M20,60 Q50,78 80,60 L75,55 Q50,70 25,55 Z" fill="#BCAAA4"/><ellipse cx="50" cy="50" rx="30" ry="14" fill="#ECEFF1"/><rect x="36" y="44" width="6" height="6" fill="white" stroke="#CFD8DC"/></svg>`
          },
          {
            id: "s2_diamond", name: "다이아몬드", type: "pure",
            desc: "탄소(C) 원자가 규칙적인 그물 구조로 결합한 순물질(원소)입니다.",
            components: ["순수한 탄소(C) 결정"],
            svg: `<svg viewBox="0 0 100 80"><polygon points="50,15 78,35 50,72 22,35" fill="#E0F7FA" stroke="#00ACC1" stroke-width="1.5"/><polyline points="22,35 50,42 78,35" fill="none" stroke="#26C6DA" stroke-width="1.2"/></svg>`
          }
        ]
      }
    ];

    let currentStageIndex = 0;
    let cardPlacements = {};
    let draggedItemId = null;
    let wrongCardIds = new Set();

    function initStage(stageIdx) {
      currentStageIndex = stageIdx;
      const currentStage = stagesData[stageIdx];

      document.getElementById('stageBadge').textContent = `🌟 ${currentStage.stage}단계 도전 중 (총 2단계)`;
      document.getElementById('stageTitle').textContent = currentStage.title;

      cardPlacements = {};
      wrongCardIds.clear();
      currentStage.items.forEach(item => cardPlacements[item.id] = 'tray');

      document.getElementById('summary-section').style.display = 'none';
      document.getElementById('nextStageBtn').style.display = 'none';

      renderAllCards();
    }

    function renderAllCards() {
      const stage = stagesData[currentStageIndex];
      const trayGrid = document.getElementById('trayGrid');
      const pureGrid = document.getElementById('pureItemsGrid');
      const mixGrid = document.getElementById('mixItemsGrid');

      trayGrid.innerHTML = '';
      pureGrid.innerHTML = '';
      mixGrid.innerHTML = '';

      let pureCount = 0, mixCount = 0;

      stage.items.forEach(item => {
        const zone = cardPlacements[item.id];
        const cardElem = createCardElement(item);

        if (wrongCardIds.has(item.id)) {
          cardElem.classList.add('is-wrong');
        }

        if (zone === 'pure') {
          pureGrid.appendChild(cardElem);
          pureCount++;
        } else if (zone === 'mix') {
          mixGrid.appendChild(cardElem);
          mixCount++;
        } else {
          trayGrid.appendChild(cardElem);
        }
      });

      document.getElementById('pureCount').textContent = `${pureCount}개`;
      document.getElementById('mixCount').textContent = `${mixCount}개`;

      if (pureCount === 0) pureGrid.innerHTML = '<div class="zone-placeholder">여기로 순물질 카드를 드래그하세요</div>';
      if (mixCount === 0) mixGrid.innerHTML = '<div class="zone-placeholder">여기로 혼합물 카드를 드래그하세요</div>';
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.setAttribute('draggable', 'true');
      card.setAttribute('data-id', item.id);

      card.innerHTML = `
        <div class="return-hint" title="원위치로 되돌리기" onclick="returnCardToTray('${item.id}', event)">✕</div>
        <div class="item-img-wrap">${item.svg}</div>
        <div class="item-name">${item.name}</div>
      `;

      card.addEventListener('dragstart', (e) => {
        draggedItemId = item.id;
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', item.id);
        playPopSound(440);
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        draggedItemId = null;
      });

      return card;
    }

    function handleDragOver(e) {
      e.preventDefault();
      const dropZone = e.currentTarget;
      if (dropZone.classList.contains('drop-zone')) dropZone.classList.add('dragover');
    }

    function handleDragLeave(e) {
      const dropZone = e.currentTarget;
      if (dropZone.classList.contains('drop-zone')) dropZone.classList.remove('dragover');
    }

    function handleDrop(e, targetZone) {
      e.preventDefault();
      const dropZone = e.currentTarget;
      if (dropZone.classList.contains('drop-zone')) dropZone.classList.remove('dragover');

      const itemId = e.dataTransfer.getData('text/plain') || draggedItemId;
      if (!itemId) return;

      cardPlacements[itemId] = targetZone;
      wrongCardIds.delete(itemId);
      playSnapSound();
      renderAllCards();
    }

    function returnCardToTray(itemId, e) {
      e.stopPropagation();
      cardPlacements[itemId] = 'tray';
      wrongCardIds.delete(itemId);
      playPopSound(350);
      renderAllCards();
    }

    function checkAnswer() {
      const stage = stagesData[currentStageIndex];
      let unplacedCount = 0, wrongCount = 0;
      wrongCardIds.clear();

      stage.items.forEach(item => {
        const placement = cardPlacements[item.id];
        if (placement === 'tray') {
          unplacedCount++;
          wrongCardIds.add(item.id);
        } else if (placement !== item.type) {
          wrongCount++;
          wrongCardIds.add(item.id);
        }
      });

      renderAllCards();

      if (unplacedCount > 0 || wrongCount > 0) {
        playErrorSound();
      } else {
        playVictorySound();
        startConfetti();
        showSummaryTable(stage);

        if (currentStageIndex < stagesData.length - 1) {
          document.getElementById('nextStageBtn').style.display = 'inline-flex';
        } else {
          const nextBtn = document.getElementById('nextStageBtn');
          nextBtn.textContent = '🏆 모든 탐구 완료!';
          nextBtn.style.display = 'inline-flex';
        }
      }
    }

    function showSummaryTable(stage) {
      const summarySection = document.getElementById('summary-section');
      const tableBody = document.getElementById('summaryTableBody');
      tableBody.innerHTML = '';

      stage.items.forEach(item => {
        const tr = document.createElement('tr');
        const badgeClass = item.type === 'pure' ? 'badge-pure' : 'badge-mix';
        const typeText = item.type === 'pure' ? '순물질' : '혼합물';
        const compHtml = item.components ? `<div style="margin-top:6px;">` + item.components.map(c => `<span class="component-tag">${c}</span>`).join('') + `</div>` : '';

        tr.innerHTML = `
          <td style="text-align: center;"><span class="${badgeClass}">${typeText}</span></td>
          <td><strong>${item.name}</strong></td>
          <td>${item.desc}${compHtml}</td>
        `;
        tableBody.appendChild(tr);
      });

      summarySection.style.display = 'block';
      summarySection.scrollIntoView({ behavior: 'smooth' });
    }

    function resetCurrentStage() { initStage(currentStageIndex); }
    function goToNextStage() {
      if (currentStageIndex < stagesData.length - 1) {
        initStage(currentStageIndex + 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // 사운드 효과
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playPopSound(freq = 400) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }
    function playSnapSound() { playPopSound(600); }
    function playErrorSound() { playPopSound(200); }
    function playVictorySound() {
      [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playPopSound(f), i * 100));
    }

    // Canvas 폭죽 연출
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let confettiList = [], animationFrameId = null;

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    function startConfetti() {
      cancelAnimationFrame(animationFrameId); confettiList = [];
      const colors = ['#f44336', '#e91e63', '#9c27b0', '#3f51b5', '#2196f3', '#4caf50', '#ffeb3b', '#ff9800'];
      for (let i = 0; i < 100; i++) {
        confettiList.push({
          x: canvas.width / 2, y: canvas.height / 2,
          w: Math.random() * 10 + 6, h: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 16, vy: (Math.random() - 1.2) * 14,
          gravity: 0.3, opacity: 1
        });
      }
      renderConfetti();
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let active = 0;
      confettiList.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.opacity -= 0.008;
        if (p.opacity > 0) {
          active++;
          ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(p.opacity, 0);
          ctx.fillRect(p.x, p.y, p.w, p.h);
        }
      });
      if (active > 0) animationFrameId = requestAnimationFrame(renderConfetti);
    }

    window.onload = () => initStage(0);
  </script>
</body>
</html>
