<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전자기 유도 가상 실험실</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Pretendard', 'Segoe UI', AppleSDGothicNeo, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 15px;
      touch-action: none;
    }
    h2 { color: #f1f5f9; margin: 5px 0 3px 0; font-size: 24px; }
    p { color: #94a3b8; margin-bottom: 12px; font-size: 14px; text-align: center; }
    
    .control-panel {
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      border: 1px solid #334155;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    label { font-weight: bold; color: #cbd5e1; font-size: 14px; }
    select, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #334155;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    select:focus, button:focus { outline: none; }
    button:hover { background-color: #475569; }
    button:active { transform: scale(0.96); }
    
    .btn-action {
      background-color: #2563eb;
      border: none;
    }
    .btn-action:hover { background-color: #1d4ed8; }

    canvas {
      background-color: #1e293b;
      border: 2px solid #475569;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>

  <h2>⚡ 전자기 유도 가상 실험실</h2>
  <p>자석이나 코일을 손가락/마우스로 움직여 보세요! (자석 세기 & 코일 감은 수에 따른 LED 밝기 변화 확인)</p>

  <div class="control-panel">
    <div class="control-group">
      <label for="magnetStrength">🧲 자석 세기:</label>
      <select id="magnetStrength">
        <option value="0.5">약함</option>
        <option value="1.0" selected>보통</option>
        <option value="2.5">🔥 매우 강함</option>
      </select>
    </div>

    <div class="control-group">
      <label for="coilTurns">🌀 코일 감은 수:</label>
      <select id="coilTurns">
        <option value="1">1번 감음 (약함)</option>
        <option value="3" selected>3번 감음 (보통)</option>
        <option value="5">5번 감음 (매우 큼)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="ledColor">💡 LED 색상:</label>
      <select id="ledColor">
        <option value="red" selected>적색 (Red)</option>
        <option value="yellow">노란색 (Amber)</option>
      </select>
    </div>

    <div class="control-group">
      <button id="flipBtn" class="btn-action">🔄 극 반전 (N ↔ S)</button>
      <button id="fullScreenBtn">⛶ 전체화면</button>
    </div>
  </div>

  <canvas id="simCanvas" width="800" height="440"></canvas>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    const strengthSelect = document.getElementById('magnetStrength');
    const turnsSelect = document.getElementById('coilTurns');
    const colorSelect = document.getElementById('ledColor');
    const flipBtn = document.getElementById('flipBtn');
    const fullScreenBtn = document.getElementById('fullScreenBtn');

    // 상태 객체
    let magnet = { 
      x: 520, y: 190, width: 140, height: 60, 
      dx: 0, isFlipped: false 
    };
    
    let coil = { x: 140, y: 160, width: 240, height: 180, dx: 0 };

    let activeTarget = null;
    let dragOffsetX = 0, dragOffsetY = 0;
    let brightness = 0;

    // 이벤트 등록
    flipBtn.addEventListener('click', () => { magnet.isFlipped = !magnet.isFlipped; });
    fullScreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
    canvas.addEventListener('mouseleave', onUp);

    canvas.addEventListener('touchstart', (e) => onDown(e.touches[0]));
    canvas.addEventListener('touchmove', (e) => onMove(e.touches[0]));
    canvas.addEventListener('touchend', onUp);

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function onDown(e) {
      const pos = getPos(e);
      if (pos.x >= magnet.x && pos.x <= magnet.x + magnet.width &&
          pos.y >= magnet.y && pos.y <= magnet.y + magnet.height) {
        activeTarget = 'magnet';
        dragOffsetX = pos.x - magnet.x;
        dragOffsetY = pos.y - magnet.y;
        return;
      }
      if (pos.x >= coil.x && pos.x <= coil.x + coil.width &&
          pos.y >= coil.y && pos.y <= coil.y + coil.height) {
        activeTarget = 'coil';
        dragOffsetX = pos.x - coil.x;
        dragOffsetY = pos.y - coil.y;
      }
    }

    function onMove(e) {
      if (!activeTarget) return;
      const pos = getPos(e);
      if (activeTarget === 'magnet') {
        const newX = pos.x - dragOffsetX;
        magnet.dx = newX - magnet.x;
        magnet.x = newX;
        magnet.y = pos.y - dragOffsetY;
      } else if (activeTarget === 'coil') {
        const newX = pos.x - dragOffsetX;
        coil.dx = newX - coil.x;
        coil.x = newX;
        coil.y = pos.y - dragOffsetY;
      }
    }

    function onUp() { activeTarget = null; }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (activeTarget !== 'magnet') magnet.dx *= 0.5;
      if (activeTarget !== 'coil') coil.dx *= 0.5;

      // 물리 공식 연산: 유도 기전력 V ∝ (자석 세기) * (감은 수) * (상대 속도)
      const relVelocity = Math.abs(magnet.dx - coil.dx);
      const magStrength = parseFloat(strengthSelect.value);
      const turns = parseInt(turnsSelect.value);
      
      const targetBrightness = relVelocity * magStrength * (turns / 3) * 5;
      brightness += (targetBrightness - brightness) * 0.2; // 부드러운 전환
      const curBrightness = Math.min(brightness, 100);

      const colorMode = colorSelect.value;
      const mainColor = colorMode === 'red' ? '#ff1744' : '#ffea00';
      const glowColor = colorMode === 'red' ? 'rgba(255, 23, 68, ' : 'rgba(255, 234, 0, ';

      // --- 1. 코일 & LED 그리기 ---
      ctx.save();
      ctx.translate(coil.x, coil.y);

      const ledX = 35;
      const ledY = 55;

      // 💥 고휘도 발광 효과 (강한 자석 + 높은 감은 수 시 전파)
      if (curBrightness > 2) {
        const glowRadius = (25 + curBrightness * 0.9);

        // 퍼져나가는 방사형 광선 (Ray)
        ctx.strokeStyle = glowColor + Math.min(curBrightness / 70, 0.8) + ')';
        ctx.lineWidth = 3;
        const rayCount = 12;
        for (let i = 0; i < rayCount; i++) {
          const angle = (i * Math.PI) / (rayCount / 2);
          ctx.beginPath();
          ctx.moveTo(ledX, ledY - 22);
          ctx.lineTo(ledX + Math.cos(angle) * (glowRadius + 20), (ledY - 22) + Math.sin(angle) * (glowRadius + 20));
          ctx.stroke();
        }

        // 중심 백색 코어 및 네온 후광
        const gradient = ctx.createRadialGradient(ledX, ledY - 22, 2, ledX, ledY - 22, glowRadius);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.2, mainColor);
        gradient.addColorStop(1, glowColor + '0)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(ledX, ledY - 22, glowRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      // LED 렌즈 (정밀 디테일)
      ctx.beginPath();
      ctx.arc(ledX, ledY - 22, 20, Math.PI, 0, false);
      ctx.lineTo(ledX + 20, ledY);
      ctx.lineTo(ledX - 20, ledY);
      ctx.closePath();

      ctx.fillStyle = curBrightness > 2 ? mainColor : (colorMode === 'red' ? '#7f1d1d' : '#713f12');
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 2.5;
      ctx.fill();
      ctx.stroke();

      // LED 내부 리드 프레임 칩 (Anode/Cathode)
      ctx.beginPath();
      ctx.moveTo(ledX - 8, ledY);
      ctx.lineTo(ledX - 8, ledY - 14);
      ctx.lineTo(ledX - 3, ledY - 9);
      ctx.moveTo(ledX + 8, ledY);
      ctx.lineTo(ledX + 8, ledY - 18);
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 2;
      ctx.stroke();

      // LED 하단 돌기 링
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(ledX - 22, ledY, 44, 5);

      // 전선 & 감은 수(Turns)에 따른 겹침 코일 그리기
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;

      // 하단 전선
      ctx.beginPath();
      ctx.moveTo(ledX - 8, ledY + 5);
      ctx.lineTo(ledX - 8, 140);
      ctx.lineTo(150, 140);
      ctx.stroke();

      // 입체 코일 묶음 (감은 수 시각화)
      for (let t = 0; t < turns; t++) {
        const offset = t * 7;
        ctx.beginPath();
        ctx.strokeStyle = t === 0 ? '#38bdf8' : '#0284c7';
        ctx.bezierCurveTo(190 + offset, 140, 190 + offset, 10, 150 + offset, 10);
        ctx.stroke();
      }

      // 상단 전선 연결
      ctx.beginPath();
      ctx.strokeStyle = '#38bdf8';
      ctx.moveTo(150, 10);
      ctx.lineTo(ledX + 8, 10);
      ctx.lineTo(ledX + 8, ledY + 5);
      ctx.stroke();

      ctx.restore();

      // --- 2. 자석 그리기 ---
      const leftColor = magnet.isFlipped ? '#3b82f6' : '#ef4444';
      const rightColor = magnet.isFlipped ? '#ef4444' : '#3b82f6';
      const leftText = magnet.isFlipped ? 'S' : 'N';
      const rightText = magnet.isFlipped ? 'N' : 'S';

      // N/S 극 분할
      ctx.fillStyle = leftColor;
      ctx.fillRect(magnet.x, magnet.y, magnet.width / 2, magnet.height);
      ctx.fillStyle = rightColor;
      ctx.fillRect(magnet.x + magnet.width / 2, magnet.y, magnet.width / 2, magnet.height);

      // 자석 텍스트
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(leftText, magnet.x + magnet.width / 4, magnet.y + 38);
      ctx.fillText(rightText, magnet.x + (magnet.width * 3) / 4, magnet.y + 38);

      // 자석 테두리
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(magnet.x, magnet.y, magnet.width, magnet.height);

      // 강한 자석 골드 후광 테두리
      if (magStrength === 2.5) {
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 4;
        ctx.strokeRect(magnet.x - 3, magnet.y - 3, magnet.width + 6, magnet.height + 6);
      }

      // --- 3. 실시간 유도 기전력(밝기) 게이지 ---
      ctx.fillStyle = '#334155';
      ctx.fillRect(20, 390, 200, 18);
      ctx.fillStyle = mainColor;
      ctx.fillRect(20, 390, (curBrightness / 100) * 200, 18);
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 1;
      ctx.strokeRect(20, 390, 200, 18);

      ctx.fillStyle = '#f8fafc';
      ctx.font = '12px Pretendard';
      ctx.textAlign = 'left';
      ctx.fillText(`유도 전류 세기: ${Math.round(curBrightness)}%`, 20, 382);

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
